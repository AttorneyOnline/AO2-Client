# Per-platform matrix: install Qt, configure + build, test, package, upload.
name: CI Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  formatting-check:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v4
     - name: Run clang-format style check for C++
       uses: jidicula/clang-format-action@v4.12.0
       with:
         clang-format-version: '17'
         check-path: 'src'
         fallback-style: LLVM

  build-windows:
    name: Windows x86_64
    needs: formatting-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@master
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.5.3
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          cache: true
          cache-key-prefix: install-qt-action
          modules: 'qtimageformats qtwebsockets'

      - name: Configure
        shell: bash
        env:
          BUILD_CONFIG: Release
        run: ./configure.sh

      - name: Build
        shell: bash
        run: |
          source build.env
          "$NINJA"

      - name: Run tests
        shell: bash
        run: ctest --output-on-failure

      - name: Package
        shell: bash
        run: ./scripts/package-windows.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@master
        with:
          name: Attorney_Online-Windows
          path: ${{ github.workspace }}/bin

  build-linux:
    name: Linux x86_64
    needs: formatting-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@master
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          version: '6.5.3'
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          cache: true
          cache-key-prefix: install-qt-action
          modules: 'qtimageformats qtwebsockets'

      - name: Configure
        env:
          BUILD_CONFIG: Release
        run: ./configure.sh

      - name: Build
        run: |
          source build.env
          "$NINJA"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      - name: Package dynamic tarball and AppImage
        run: ./scripts/package-linux.sh

      - name: Upload Dynamic Artifact
        uses: actions/upload-artifact@master
        with:
          name: Attorney_Online-Linux-Dynamic
          path: bin

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@master
        with:
          name: Attorney_Online-Linux-AppImage
          path: bin-appimage

  build-linux-arm:
    name: Linux arm64
    needs: formatting-check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@master
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          # Qt ships Linux ARM64 desktop binaries only from 6.7 onward.
          version: '6.8.3'
          host: 'linux_arm64'
          target: 'desktop'
          arch: 'linux_gcc_arm64'
          cache: true
          cache-key-prefix: install-qt-action
          modules: 'qtimageformats qtwebsockets'

      - name: Configure
        env:
          BUILD_CONFIG: Release
        run: ./configure.sh

      - name: Build
        run: |
          source build.env
          "$NINJA"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      - name: Package dynamic tarball and AppImage
        run: ./scripts/package-linux.sh

      - name: Upload Dynamic Artifact
        uses: actions/upload-artifact@master
        with:
          name: Attorney_Online-Linux-arm64-Dynamic
          path: bin

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@master
        with:
          name: Attorney_Online-Linux-arm64-AppImage
          path: bin-appimage

  build-macos:
    name: macOS arm64
    needs: formatting-check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@master
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.1.*'
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true
          cache-key-prefix: install-qt-action
          modules: 'qtimageformats qtwebsockets'

      - name: Configure
        env:
          BUILD_CONFIG: Release
        run: ./configure.sh

      - name: Build
        run: |
          source build.env
          "$NINJA"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      - name: Package app
        run: ./scripts/package-macos.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@master
        with:
          name: Attorney_Online-macOS
          path: Attorney_Online-macOS.zip
